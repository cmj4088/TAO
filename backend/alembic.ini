# Alembic config - database schema version migration
# Called programmatically by app/database.py (upgrade head) at startup.
# Manual usage: cd backend && alembic upgrade head
# NOTE: keep this file ASCII-only (configparser decodes with locale codec).

[alembic]
script_location = alembic
prepend_sys_path = .

# Real URL is set by alembic/env.py from TAO_DATABASE_URL env var,
# falling back to the default below (same as app/database.py)
sqlalchemy.url = sqlite:///./data/tao.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
